<title>ULTRON AI</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0; min-height: 100vh;

  background: #080306; color: #ff5368;

  font-family: Arial, sans-serif;

  display: grid; place-items: center;

  padding: 20px;

}

main { text-align: center; width: 100%; max-width: 430px; }

h1 { letter-spacing: 10px; text-shadow: 0 0 20px red; }

.sub { letter-spacing: 3px; font-size: 11px; color: #b52b43; }

.orb {

  width: 210px; height: 210px; border-radius: 50%;

  margin: 35px auto; display: grid; place-items: center;

  border: 2px solid #ff243e;

  box-shadow: 0 0 35px #ff1838, inset 0 0 30px #a00020;

  background: radial-gradient(circle, #68101e, #080306 70%);
